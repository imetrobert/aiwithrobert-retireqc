name: Build guide
# Rebuilds guide.pdf from docs/guide/*.md and docs/guide/img when they change. Edit the .md, never the PDF.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/guide/**', 'scripts/build_guide.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-liberation poppler-utils
          pip install reportlab pillow pypdf
      - name: Build guide.pdf
        run: python3 scripts/build_guide.py
      - name: Commit guide.pdf if it changed
        run: |
          if [ -n "$(git status --porcelain guide.pdf)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add guide.pdf
            git commit -m "Rebuild guide.pdf"
            git pull --rebase -q || true
          git push
          fi
